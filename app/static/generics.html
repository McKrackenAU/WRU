<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Generic MoAs · WRU</title>
  <link rel="icon" href="/static/brand/veninspect-mark.png" type="image/png" />
  <link rel="stylesheet" href="/static/css/fonts.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("wru-tgs-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        } else document.documentElement.style.colorScheme = "light";
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" data-app-header></header>
    <main id="main-content" tabindex="-1" class="main">
      <div class="page-head">
        <div>
          <h1>Generic MoAs</h1>
          <p>Network-wide generic applications. Open a job to see the linked MoA and files.</p>
        </div>
        <div class="toolbar">
          <a class="btn" href="/">Sites</a>
          <a class="btn" href="/documents">Documents</a>
        </div>
      </div>
      <section class="panel-card">
        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>MoA</th>
                <th>Road / site</th>
                <th>Program</th>
                <th>Valid</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbody"><tr><td class="empty" colspan="5">Loading…</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer class="app-footer" data-app-footer></footer>
  </div>
  <script type="module" src="/static/js/generics.js"></script>
</body>
</html>
