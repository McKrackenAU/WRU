<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Comms · WRU TGS Tracker</title>
  <link rel="icon" href="/static/brand/veninspect-mark.png" type="image/png" />
  <link rel="stylesheet" href="/static/css/fonts.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("wru-tgs-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        } else document.documentElement.style.colorScheme = "light";
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" data-app-header></header>
    <main id="main-content" tabindex="-1" class="main comms-main">
      <div class="page-head">
        <div>
          <h1>Stakeholder communications</h1>
          <p id="commsStatus">Job plus workpack or site number stay on the list. Open a row for the full planner, or click a colour dot to code a group.</p>
        </div>
        <div class="toolbar">
          <button type="button" class="btn" id="btnRenameSheet">Rename tab</button>
          <button type="button" class="btn" id="btnAddSheet">Add tab</button>
          <button type="button" class="btn btn-danger" id="btnDeleteSheet">Remove tab</button>
        </div>
      </div>

      <div class="tabs" role="tablist" id="sheetTabs"></div>

      <section class="panel-card comms-toolbar-card">
        <div class="comms-toolbar">
          <input id="commsSearch" type="search" placeholder="Search this planner…" />
          <div class="comms-filters" id="commsFilters"></div>
          <button type="button" class="btn" id="btnColumns">Columns</button>
          <button type="button" class="btn btn-primary" id="btnAddRow">Add row</button>
          <span class="hint" id="commsCount"></span>
        </div>
      </section>

      <div class="table-card comms-table-card">
        <div class="table-scroll comms-scroll" id="commsTableWrap">
          <p class="hint">Loading…</p>
        </div>
      </div>
    </main>
    <footer class="app-footer" data-app-footer></footer>
  </div>

  <aside class="drawer" id="commsDrawer" hidden aria-hidden="true">
    <div class="drawer-backdrop" data-close-comms-drawer></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="commsDrawerTitle">
      <header class="drawer-head">
        <div>
          <p class="drawer-kicker" id="commsDrawerKicker">Planner row</p>
          <h2 id="commsDrawerTitle">Activity</h2>
        </div>
        <button type="button" class="icon-btn" data-close-comms-drawer aria-label="Close">×</button>
      </header>
      <div class="drawer-tabs" role="tablist" id="commsDrawerTabs"></div>
      <div class="drawer-body" id="commsDrawerBody"></div>
      <footer class="drawer-foot">
        <button type="button" class="btn btn-danger" id="btnDrawerDelete">Delete row</button>
        <div class="spacer"></div>
        <button type="button" class="btn" data-close-comms-drawer>Close</button>
      </footer>
    </div>
  </aside>

  <dialog id="columnsDialog" class="panel">
    <form id="columnsForm" onsubmit="return false;">
      <header class="panel-head">
        <h2>Planner columns</h2>
        <button type="button" class="icon-btn" data-close-dialog="columnsDialog" aria-label="Close">×</button>
      </header>
      <div class="panel-body">
        <p class="hint">Add, rename, or remove columns on this tab only. Job link and documents stay in the side panel.</p>
        <ul id="columnList" class="column-list"></ul>
        <div class="add-column form-grid">
          <label>Name<input id="colName" maxlength="128" /></label>
          <label>Type
            <select id="colType">
              <option value="text">Text</option>
              <option value="number">Number</option>
              <option value="date">Date</option>
              <option value="checkbox">Checkbox</option>
              <option value="select">Select</option>
            </select>
          </label>
          <label class="full" id="colOptionsWrap" hidden>Options (comma-separated)
            <input id="colOptions" placeholder="Yes, No, Reassess" />
          </label>
        </div>
      </div>
      <footer class="panel-foot">
        <button type="button" class="btn btn-primary" id="btnAddColumn">Add column</button>
        <div class="spacer"></div>
        <button type="button" class="btn" data-close-dialog="columnsDialog">Close</button>
      </footer>
    </form>
  </dialog>

  <script type="module" src="/static/js/comms.js"></script>
</body>
</html>
