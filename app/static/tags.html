<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tags · WRU Admin</title>
  <link rel="icon" href="/static/brand/veninspect-mark.png" type="image/png" />
  <link rel="stylesheet" href="/static/css/fonts.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("wru-tgs-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        } else document.documentElement.style.colorScheme = "light";
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" data-app-header></header>
    <main id="main-content" tabindex="-1" class="main">
      <div class="page-head">
        <div>
          <h1>Tags</h1>
          <p>Create the tag names here. Apply them to people on <a href="/admin/users">Users</a>. Apply them to jobs — or to a whole program heading — on the site register. Category tags then show on every job in that program.</p>
        </div>
      </div>

      <section class="panel-card">
        <h2>Add tag</h2>
        <form class="form-grid" id="createTagForm">
          <label>
            Name
            <input id="newTagLabel" required maxlength="64" autocomplete="off" placeholder="e.g. Structures" />
          </label>
          <div class="full">
            <button type="submit" class="btn btn-primary">Create tag</button>
          </div>
        </form>
        <p class="hint" id="createTagMsg" aria-live="polite"></p>
      </section>

      <section class="panel-card" style="margin-top:1.25rem">
        <h2>Library</h2>
        <div id="tagsTableWrap">
          <p class="hint">Loading…</p>
        </div>
      </section>
    </main>
    <footer class="app-footer" data-app-footer></footer>
  </div>
  <script type="module" src="/static/js/tags.js"></script>
</body>
</html>
