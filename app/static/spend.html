<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Actual spend · WRU TGS Tracker</title>
  <link rel="icon" href="/static/brand/veninspect-mark.png" type="image/png" />
  <link rel="stylesheet" href="/static/css/fonts.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("wru-tgs-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        } else document.documentElement.style.colorScheme = "light";
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" data-app-header></header>
    <main id="main-content" tabindex="-1" class="main">
      <div class="page-head">
        <div>
          <h1>Actual spend</h1>
          <p>Enter spend manually or calculate it from traffic and asphalt rate cards, then export to Excel or PDF.</p>
        </div>
        <div class="toolbar">
          <a class="btn" id="btnExportXlsx" href="#">Export Excel</a>
          <a class="btn btn-primary" id="btnExportPdf" href="#">Export PDF</a>
        </div>
      </div>

      <section class="panel-card form-grid">
        <label>Kind
          <select id="filterKind">
            <option value="">All</option>
            <option value="traffic">Traffic</option>
            <option value="asphalt">Pavements / asphalt</option>
          </select>
        </label>
        <label>Site
          <select id="filterSite">
            <option value="">All sites</option>
          </select>
        </label>
        <label>Traffic contractor
          <select id="filterTraffic">
            <option value="">Any</option>
          </select>
        </label>
        <label>Asphalt contractor
          <select id="filterAsphalt">
            <option value="">Any</option>
          </select>
        </label>
        <label>From <input id="filterFrom" type="date" /></label>
        <label>To <input id="filterTo" type="date" /></label>
        <div class="full">
          <button type="button" class="btn" id="btnApplyFilters">Apply filters</button>
          <span class="hint" id="spendStatus"></span>
        </div>
      </section>

      <section class="panel-card" style="margin-top:1rem">
        <h2>Add spend</h2>
        <form class="form-grid" id="spendForm">
          <label>Kind
            <select id="spendKind" required>
              <option value="traffic">Traffic</option>
              <option value="asphalt">Pavements / asphalt</option>
            </select>
          </label>
          <label>How
            <select id="spendSource">
              <option value="calculated">From rates</option>
              <option value="manual">Manual amount</option>
            </select>
          </label>
          <label>Site
            <select id="spendSite" required>
              <option value="">Select site…</option>
            </select>
          </label>
          <label>Work date <input id="spendDate" type="date" /></label>
          <label id="spendAmountWrap" hidden>Amount ($)
            <input id="spendAmount" type="number" min="0" step="0.01" />
          </label>
          <label id="spendTrafficWrap">Traffic contractor
            <select id="spendTraffic"><option value="">None</option></select>
          </label>
          <label id="spendAsphaltWrap" hidden>Asphalt contractor
            <select id="spendAsphalt"><option value="">None</option></select>
          </label>
          <label>Category <input id="spendCategory" placeholder="Crew, VMS, mill/fill…" /></label>
          <label>Invoice ref <input id="spendInvoice" /></label>
          <label class="full">Notes <input id="spendNotes" /></label>

          <div id="calcTrafficFields" class="full form-grid" style="margin:0">
            <label>People <input id="tPeople" type="number" min="0" step="1" value="0" /></label>
            <label>Vehicles <input id="tVehicles" type="number" min="0" step="1" value="0" /></label>
            <label>TMAs <input id="tTmas" type="number" min="0" step="1" value="0" /></label>
            <label>Spotters <input id="tSpotters" type="number" min="0" step="1" value="0" /></label>
            <label>Shift hours <input id="tShiftHours" type="number" min="0" step="0.5" value="10" /></label>
            <label>Shift type
              <select id="tShiftType">
                <option value="day">Day</option>
                <option value="night">Night</option>
              </select>
            </label>
          </div>

          <div id="calcAsphaltFields" class="full" hidden>
            <label style="display:block;margin-bottom:0.5rem">Shift type
              <select id="aShiftType">
                <option value="day">Day</option>
                <option value="night">Night</option>
              </select>
            </label>
            <div id="asphaltLinesWrap"></div>
            <button type="button" class="btn" id="btnAddAsphaltLine" style="margin-top:0.5rem">Add rate line</button>
          </div>

          <div class="full" id="previewWrap" style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
            <button type="button" class="btn" id="btnPreview">Preview from rates</button>
            <span class="hint" id="spendPreview">Calculated amount will appear here.</span>
          </div>
          <div class="full"><button type="submit" class="btn btn-primary">Save spend</button></div>
        </form>
      </section>

      <section class="panel-card" style="margin-top:1rem">
        <div class="page-head" style="margin:0 0 0.75rem;padding:0">
          <h2 style="margin:0;font-size:1.05rem">Spend register</h2>
          <span class="hint" id="spendTotal">$0.00</span>
        </div>
        <div class="table-wrap">
          <table class="data-table" id="spendTable">
            <thead>
              <tr>
                <th>Kind</th>
                <th>Date</th>
                <th>Site</th>
                <th>Contractor</th>
                <th>Source</th>
                <th>Category</th>
                <th>Invoice</th>
                <th>Amount</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="spendBody">
              <tr><td colspan="9"><span class="hint">Loading…</span></td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <footer class="app-footer" data-app-footer></footer>
  </div>
  <script type="module" src="/static/js/spend.js"></script>
</body>
</html>
