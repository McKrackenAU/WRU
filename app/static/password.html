<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Change password · WRU TGS Tracker</title>
  <link rel="icon" href="/static/brand/veninspect-mark.png" type="image/png" />
  <link rel="stylesheet" href="/static/css/fonts.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("wru-tgs-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        } else document.documentElement.style.colorScheme = "light";
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" data-app-header></header>
    <main id="main-content" tabindex="-1" class="main">
      <div class="page-head">
        <div>
          <h1>Change password</h1>
          <p id="passwordHint">Choose a new password for your account. It must be at least 8 characters.</p>
        </div>
      </div>

      <section class="panel-card password-card">
        <div id="mustChangeBanner" class="must-change-banner" hidden>
          Your administrator set a temporary password. You need to choose a new one before continuing.
        </div>
        <form class="password-form" id="passwordForm" autocomplete="on">
          <div id="passwordError" class="login-error" role="alert" hidden></div>
          <label>
            Current password
            <input id="currentPassword" name="current-password" type="password" autocomplete="current-password" required />
          </label>
          <label>
            New password
            <input id="newPassword" name="new-password" type="password" autocomplete="new-password" required minlength="8" />
          </label>
          <label>
            Confirm new password
            <input id="confirmPassword" name="confirm-password" type="password" autocomplete="new-password" required minlength="8" />
          </label>
          <button type="submit" class="btn btn-primary" id="passwordBtn">Update password</button>
        </form>
      </section>
    </main>
    <footer class="app-footer" data-app-footer></footer>
  </div>
  <script type="module" src="/static/js/password.js"></script>
</body>
</html>
