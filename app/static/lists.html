<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Client lists · WRU TGS Tracker</title>
  <link rel="icon" href="/static/brand/veninspect-mark.png" type="image/png" />
  <link rel="stylesheet" href="/static/css/fonts.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("wru-tgs-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        } else document.documentElement.style.colorScheme = "light";
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" data-app-header></header>
    <main id="main-content" tabindex="-1" class="main page-lists">
      <div class="page-head lists-page-head">
        <div>
          <h1>Client priority lists</h1>
          <p>Permits and TRIMS are mutually exclusive. Approved / received MoAs leave both lists. Not yet submitted to DTP do not appear.</p>
        </div>
      </div>

      <section class="panel-card lists-filters" aria-label="List filters">
        <div class="lists-filter-block">
          <span class="lists-filter-label">Priority</span>
          <div class="lists-check-row" id="filterPriority"></div>
        </div>
        <div class="lists-filter-block">
          <span class="lists-filter-label">Program</span>
          <div class="lists-check-row" id="filterProgram"></div>
        </div>
        <label class="lists-cap-field">
          <span class="lists-filter-label">Show top</span>
          <input id="listCap" type="number" min="1" max="500" inputmode="numeric" placeholder="All" />
        </label>
        <div class="lists-filter-actions">
          <button type="button" class="btn btn-sm" id="btnFiltersAll">Show all</button>
          <button type="button" class="btn btn-sm" id="btnFiltersClear">Clear</button>
        </div>
      </section>

      <div class="split-2 lists-layout">
        <section class="panel-card">
          <div class="page-head lists-panel-head">
            <div>
              <h2>Permits team</h2>
              <p class="hint" id="permitsHint">Loading…</p>
            </div>
            <div class="toolbar">
              <a class="btn js-list-export" data-export="/api/export/permits-list.csv" href="/api/export/permits-list.csv">CSV</a>
              <a class="btn js-list-export" data-export="/api/export/permits-list.xlsx" href="/api/export/permits-list.xlsx">Excel</a>
              <a class="btn btn-primary js-list-export" data-export="/api/export/permits-list.pdf" href="/api/export/permits-list.pdf">PDF</a>
            </div>
          </div>
          <div class="table-card lists-table-card">
            <div class="table-scroll">
              <table class="data-table lists-table" data-list="permits">
                <colgroup>
                  <col class="col-pri" />
                  <col class="col-road" />
                  <col class="col-site" />
                  <col class="col-program" />
                  <col class="col-start" />
                  <col class="col-council" />
                  <col class="col-moa" />
                  <col class="col-open" />
                </colgroup>
                <thead>
                  <tr>
                    <th><button type="button" class="th-sort" data-sort="pri">Pri</button></th>
                    <th><button type="button" class="th-sort" data-sort="road">Road</button></th>
                    <th><button type="button" class="th-sort" data-sort="site">Site #</button></th>
                    <th><button type="button" class="th-sort" data-sort="program">Program</button></th>
                    <th><button type="button" class="th-sort is-active" data-sort="start" data-dir="asc">Start</button></th>
                    <th><button type="button" class="th-sort" data-sort="council">Council wait</button></th>
                    <th><button type="button" class="th-sort" data-sort="moa">MoA #</button></th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="permitsBody"></tbody>
              </table>
            </div>
          </div>
        </section>

        <section class="panel-card">
          <div class="page-head lists-panel-head">
            <div>
              <h2>TRIMS team</h2>
              <p class="hint" id="trimsHint">Loading…</p>
            </div>
            <div class="toolbar">
              <a class="btn js-list-export" data-export="/api/export/trims-list.csv" href="/api/export/trims-list.csv">CSV</a>
              <a class="btn js-list-export" data-export="/api/export/trims-list.xlsx" href="/api/export/trims-list.xlsx">Excel</a>
              <a class="btn btn-primary js-list-export" data-export="/api/export/trims-list.pdf" href="/api/export/trims-list.pdf">PDF</a>
            </div>
          </div>
          <div class="table-card lists-table-card">
            <div class="table-scroll">
              <table class="data-table lists-table" data-list="trims">
                <colgroup>
                  <col class="col-pri" />
                  <col class="col-road" />
                  <col class="col-site" />
                  <col class="col-program" />
                  <col class="col-start" />
                  <col class="col-council" />
                  <col class="col-moa" />
                  <col class="col-open" />
                </colgroup>
                <thead>
                  <tr>
                    <th><button type="button" class="th-sort" data-sort="pri">Pri</button></th>
                    <th><button type="button" class="th-sort" data-sort="road">Road</button></th>
                    <th><button type="button" class="th-sort" data-sort="site">Site #</button></th>
                    <th><button type="button" class="th-sort" data-sort="program">Program</button></th>
                    <th><button type="button" class="th-sort is-active" data-sort="start" data-dir="asc">Start</button></th>
                    <th><button type="button" class="th-sort" data-sort="council">Council wait</button></th>
                    <th><button type="button" class="th-sort" data-sort="moa">MoA #</button></th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="trimsBody"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </main>
    <footer class="app-footer" data-app-footer></footer>
  </div>
  <script type="module" src="/static/js/lists.js"></script>
</body>
</html>
