<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Activity · WRU TGS Tracker</title>
  <link rel="icon" href="/static/brand/veninspect-mark.png" type="image/png" />
  <link rel="stylesheet" href="/static/css/fonts.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("wru-tgs-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        } else document.documentElement.style.colorScheme = "light";
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" data-app-header></header>
    <main id="main-content" tabindex="-1" class="main">
      <div class="page-head">
        <div>
          <h1>Activity</h1>
          <p>Who changed what — status moves, costs, archive/restore, and notes across the active register.</p>
        </div>
        <div class="toolbar">
          <a class="btn" href="/">Sites register</a>
          <a class="btn" href="/lists">Client lists</a>
        </div>
      </div>
      <div class="filters">
        <input id="search" type="search" placeholder="Search road, site, person, message…" />
        <select id="programFilter"><option value="">All programs</option></select>
        <select id="typeFilter">
          <option value="">All types</option>
          <option value="status">Status changes</option>
          <option value="cost">Costs</option>
          <option value="archive">Archive</option>
          <option value="restore">Restore</option>
          <option value="note">Notes</option>
          <option value="edit">Other edits</option>
        </select>
      </div>
      <div class="table-card">
        <div class="table-scroll">
          <table class="data-table activity-table">
            <thead>
              <tr>
                <th>When</th>
                <th>Activity</th>
                <th>Program</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tbody"><tr><td class="empty" colspan="4">Loading…</td></tr></tbody>
          </table>
        </div>
      </div>
      <p class="foot-note" id="statusLine"></p>
    </main>
    <footer class="app-footer" data-app-footer></footer>
  </div>
  <script type="module" src="/static/js/tracking.js"></script>
</body>
</html>
